<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Tasks — TaskFlow Pro</title><link rel="stylesheet" href="style.css"></head><body><div class="app"><aside class="side"><div class="brand"><div class="logo">✓</div>TaskFlow</div><nav class="nav"><a href="home.html">◈ &nbsp; Dashboard</a><a class="active" href="tasks.html">☷ &nbsp; My Tasks</a><a href="profile.html">◉ &nbsp; Profile</a><a href="#" onclick="logout()">↪ &nbsp; Logout</a></nav></aside><main class="main"><header class="topbar"><div><div class="eyebrow">Productivity</div><h1>My Tasks</h1><div class="sub">Capture, organize and complete your work.</div></div><button class="btn" onclick="openModal()">+ Add Task</button></header><section class="filters"><input id="search" placeholder="Search tasks..." oninput="render()"><select id="status" onchange="render()"><option value="all">All status</option><option value="pending">Pending</option><option value="done">Completed</option></select><select id="filterPriority" onchange="render()"><option value="all">All priority</option><option value="high">High</option><option value="medium">Medium</option><option value="low">Low</option></select></section><section id="list" class="tasklist"></section></main></div><div class="modal" id="modal"><div class="modalbox"><div class="head"><h2 id="modalTitle">Add Task</h2><button class="btn secondary" onclick="closeModal()">✕</button></div><div class="row"><label>Task title</label><input id="title" placeholder="e.g. Finish DBMS assignment"></div><div class="row"><label>Description</label><textarea id="desc" rows="3" placeholder="Add details..."></textarea></div><div class="twocol"><div class="row"><label>Priority</label><select id="priority"><option value="low">Low</option><option value="medium" selected>Medium</option><option value="high">High</option></select></div><div class="row"><label>Due date</label><input id="due" type="date"></div></div><input id="edit" type="hidden"><button class="btn full" onclick="save()">Save Task</button></div></div><script src="app.js"></script></body></html>
