<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>My To-Do List</title>
<style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
        font-family: Arial, sans-serif;
        min-height: 100vh;
        background: linear-gradient(135deg, #eef2ff, #f8fafc);
        color: #1e293b;
        display: flex;
        justify-content: center;
        padding: 40px 16px;
    }
    .container {
        width: 100%;
        max-width: 720px;
        background: white;
        border-radius: 20px;
        padding: 30px;
        box-shadow: 0 15px 40px rgba(15, 23, 42, .12);
    }
    h1 { text-align: center; margin-bottom: 8px; font-size: 32px; }
    .subtitle { text-align: center; color: #64748b; margin-bottom: 25px; }
    .input-row { display: flex; gap: 10px; margin-bottom: 22px; }
    #taskInput {
        flex: 1;
        padding: 14px 16px;
        border: 2px solid #e2e8f0;
        border-radius: 12px;
        font-size: 16px;
        outline: none;
    }
    #taskInput:focus { border-color: #6366f1; }
    button {
        border: none;
        border-radius: 10px;
        padding: 11px 15px;
        font-size: 14px;
        font-weight: 600;
        cursor: pointer;
        transition: .2s;
    }
    button:hover { transform: translateY(-1px); opacity: .9; }
    .add-btn { background: #4f46e5; color: white; padding: 0 22px; }
    .stats {
        display: grid;
        grid-template-columns: repeat(3, 1fr);
        gap: 10px;
        margin-bottom: 20px;
    }
    .stat {
        background: #f8fafc;
        padding: 13px;
        border-radius: 12px;
        text-align: center;
    }
    .stat strong { display: block; font-size: 21px; }
    .stat span { color: #64748b; font-size: 12px; }
    .task-list { list-style: none; }
    .task {
        display: flex;
        align-items: center;
        gap: 12px;
        padding: 14px;
        border: 1px solid #e2e8f0;
        border-radius: 12px;
        margin-bottom: 10px;
        background: #fff;
    }
    .task.completed .task-text {
        text-decoration: line-through;
        color: #94a3b8;
    }
    .check {
        width: 21px;
        height: 21px;
        accent-color: #4f46e5;
        cursor: pointer;
    }
    .task-text { flex: 1; word-break: break-word; }
    .delete-btn { background: #fee2e2; color: #b91c1c; }
    .empty {
        text-align: center;
        color: #94a3b8;
        padding: 30px 10px;
    }
    .exit-btn {
        width: 100%;
        margin-top: 12px;
        background: #0f172a;
        color: white;
        padding: 13px;
    }
    .footer {
        text-align: center;
        color: #94a3b8;
        font-size: 12px;
        margin-top: 18px;
    }
    @media (max-width: 520px) {
        .container { padding: 22px; }
        .input-row { flex-direction: column; }
        .add-btn { padding: 13px; }
    }
</style>
</head>
<body>

<div class="container">
    <h1>📝 My To-Do List</h1>
    <p class="subtitle">Organize your tasks and stay productive.</p>

    <div class="input-row">
        <input id="taskInput" type="text" placeholder="Enter a new task..." maxlength="150">
        <button class="add-btn" onclick="addTask()">Add Task</button>
    </div>

    <div class="stats">
        <div class="stat"><strong id="total">0</strong><span>Total Tasks</span></div>
        <div class="stat"><strong id="completed">0</strong><span>Completed</span></div>
        <div class="stat"><strong id="pending">0</strong><span>Pending</span></div>
    </div>

    <ul id="taskList" class="task-list"></ul>

    <button class="exit-btn" onclick="exitApp()">Exit</button>

    <div class="footer">To-Do List Project • HTML, CSS & JavaScript</div>
</div>

<script>
    let tasks = JSON.parse(localStorage.getItem("todoTasks")) || [];

    function saveTasks() {
        localStorage.setItem("todoTasks", JSON.stringify(tasks));
    }

    function addTask() {
        const input = document.getElementById("taskInput");
        const text = input.value.trim();

        if (!text) {
            alert("Please enter a task.");
            return;
        }

        tasks.push({
            id: Date.now(),
            text: text,
            completed: false
        });

        input.value = "";
        saveTasks();
        renderTasks();
        input.focus();
    }

    function toggleTask(id) {
        tasks = tasks.map(task =>
            task.id === id ? {...task, completed: !task.completed} : task
        );
        saveTasks();
        renderTasks();
    }

    function deleteTask(id) {
        tasks = tasks.filter(task => task.id !== id);
        saveTasks();
        renderTasks();
    }

    function renderTasks() {
        const list = document.getElementById("taskList");

        if (tasks.length === 0) {
            list.innerHTML = '<li class="empty">No tasks yet. Add your first task! 🚀</li>';
        } else {
            list.innerHTML = tasks.map(task => `
                <li class="task ${task.completed ? "completed" : ""}">
                    <input class="check" type="checkbox"
                        ${task.completed ? "checked" : ""}
                        onchange="toggleTask(${task.id})">
                    <span class="task-text">${escapeHtml(task.text)}</span>
                    <button class="delete-btn" onclick="deleteTask(${task.id})">Delete</button>
                </li>
            `).join("");
        }

        const completed = tasks.filter(t => t.completed).length;
        document.getElementById("total").textContent = tasks.length;
        document.getElementById("completed").textContent = completed;
        document.getElementById("pending").textContent = tasks.length - completed;
    }

    function escapeHtml(text) {
        const div = document.createElement("div");
        div.textContent = text;
        return div.innerHTML;
    }

    function exitApp() {
        alert("Thank you for using My To-Do List!");
    }

    document.getElementById("taskInput").addEventListener("keydown", function(e) {
        if (e.key === "Enter") addTask();
    });

    renderTasks();
</script>

</body>
</html>
